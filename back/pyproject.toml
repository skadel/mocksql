[tool.poetry]
name = "mocksql"
version = "0.2.0"
description = "SQL unit test data generator for Analytics Engineers — SQLGlot extracts constraints, LLM generates fixtures, DuckDB validates with automatic retry on empty results"
authors = ["Adel Skhiri <skhiriadel92@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/skadel/mocksql"
repository = "https://github.com/skadel/mocksql"
keywords = ["sql", "testing", "analytics", "bigquery", "duckdb", "langgraph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
packages = [
  { include = "app" },
  { include = "cli" },
  { include = "build_query" },
  { include = "models" },
  { include = "init" },
  { include = "sql_functions" },
  { include = "utils" },
  { include = "storage" },
]
include = [
  { path = "common_vars.py", format = ["sdist", "wheel"] },
  { path = "server.py", format = ["sdist", "wheel"] },
  { path = "static/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
typer = {extras = ["all"], version = "^0.27.0"}
uvicorn = "^0.51.0"
langchain = "^1.3.14"
langchain-classic = "1.0.8"
pydantic = ">=2.13.4,<3.0.0"
python-dotenv = "^1.2.2"
duckdb = "^1.5.4"
# Requis par le client Python DuckDB pour matérialiser un TIMESTAMPTZ
# (fetchone/fetchdf) ; pandas 3.x ne le tire plus transitivement.
pytz = "*"
sqlglot = {version = "^30.12.0", extras = ["c"]}
pandas = "^3.0.3"
langgraph = "^1.2.9"
langchain-google-genai = "^4.2.7"
faker = "^40.31.0"

# sécurité et hashing
bcrypt = "^5.0.0"

fastapi = ">=0.139.2,<1.0.0"
pyyaml = ">=6.0.3"

# Connecteurs sources optionnels (dépendances lourdes : pyarrow, grpc…).
# Installés via les extras pour garder l'install de base légère.
# pip install mocksql[bigquery] / [snowflake] / [trino] / [all]
google-cloud-bigquery = {version = "^3.42.2", optional = true}
snowflake-connector-python = {version = "^4.7.1", optional = true}
trino = {version = "^0.338", optional = true}
langchain-openai = "^1.3.5"

[tool.poetry.extras]
bigquery = ["google-cloud-bigquery"]
snowflake = ["snowflake-connector-python"]
trino = ["trino"]
all = ["google-cloud-bigquery", "snowflake-connector-python", "trino"]


[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.21.0"
ruff = "^0.15.22"
vulture = "^2.16"
pytest = "^9.1"
pytest-cov = "^7.1.0"
pytest-asyncio = "^1.4.0"
pytest-mock = "^3.15.1"
httpx = "^0.28.1"

[tool.ruff.lint]
# Défauts ruff (E4/E7/E9 + F) + flake8-bandit (S) pour la sécurité. Les règles S
# à fort bruit et inhérentes au domaine (asserts de tests, SQL en f-string au cœur
# d'un outil de test SQL) sont désactivées ; on garde le signal utile : subprocess,
# bind-all-interfaces, etc. Audit sécu 2026-07.
select = ["E4", "E7", "E9", "F", "S"]
ignore = [
    "S101",  # assert — omniprésent et légitime (tests + gardes internes)
    "S608",  # SQL en f-string — construction interne de requêtes DuckDB (par design)
    "S110",  # try/except/pass — nettoyages best-effort assumés
    "S112",  # try/except/continue — idem
    "S311",  # random non-crypto — génération de données de test, pas de la crypto
]

[tool.ruff.lint.per-file-ignores]
# Les tests utilisent assert + subprocess + données factices → S non pertinent.
"tests/**" = ["S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.poetry.scripts]
mocksql     = "cli.main:main"
load         = "init.load_categorical_fields:main"
init_db      = "init.init_db:cli_main"
alter_table  = "init.alter_table:cli_main"
grant        = "init.grant_access_to_db:main"
create_user  = "init.create_user:main"
add_column  = "init.add_column:main"
add_table   = "init.add_table:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
